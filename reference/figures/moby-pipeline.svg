<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 940" width="820" height="940"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
     role="img" aria-label="moby data preparation workflow in five stages: import, validate, enrich, clean and bin, declare - producing a mobyData object that feeds the analysis pathways">
  <title>moby data preparation, in five stages</title>
  <desc>Raw detections, a receiver deployment log and tag metadata are imported (optional), the receiver log is validated read-only with checkDeployments, the side tables are folded into the detections with assignAnimalIDs and matchDeployments, the data is cleaned and binned with filterDetections, correctPositions and getTimeBins, and as_moby declares study metadata. The result is a mobyData object feeding residency, space use, movement, social network and spatial network analyses. Essential steps are marked in teal, optional ones in ochre.</desc>

  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a8"/>
    </marker>
    <filter id="pcard" x="-5%" y="-6%" width="110%" height="116%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#243447" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- opaque panel so the figure reads identically in light and dark themes -->
  <rect x="0" y="0" width="820" height="940" rx="12" fill="#ffffff" stroke="#e6eaf0" stroke-width="1"/>

  <!-- ==================== header ==================== -->
  <text x="34" y="45" font-size="17" font-weight="700" fill="#2d3748" letter-spacing="0.2">moby · preparing your data</text>
  <text x="34" y="67" font-size="13" font-style="italic" fill="#94a3b8">five stages, from a raw export to an analysis-ready dataset</text>
  <circle cx="596" cy="40" r="4.6" fill="#2F7E8C"/>
  <text x="609" y="45" font-size="13" fill="#576372">essential</text>
  <circle cx="700" cy="40" r="4.6" fill="#AD7132"/>
  <text x="713" y="45" font-size="13" fill="#576372">optional</text>

  <!-- ==================== RAW DATA ==================== -->
  <rect x="34" y="92" width="752" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#pcard)"/>
  <text x="54" y="122" font-size="15" font-weight="700" fill="#475569" letter-spacing="0.2">RAW DATA</text>
  <text x="310" y="122" font-size="15" fill="#576372">detection export · receiver log · tag metadata</text>
  <text x="310" y="146" font-size="12.5" fill="#b0b9c6">VUE · VDAT · GLATOS · OTN · ETN · generic</text>
  <line x1="410" y1="168" x2="410" y2="192" stroke="#8b98a8" stroke-width="2" marker-end="url(#pa)"/>

  <!-- ==================== 1 · IMPORT ==================== -->
  <rect x="34" y="194" width="752" height="104" rx="9" fill="#f6f8fb" stroke="#b9c4d3" stroke-width="1.2" filter="url(#pcard)"/>
  <text x="54" y="224" font-size="15" font-weight="700" fill="#3f4a5a" letter-spacing="0.2">1 · IMPORT</text>
  <text x="54" y="246" font-size="12.5" font-style="italic" fill="#94a3b8">harmonise any source</text>
  <text x="54" y="266" font-size="12.5" font-style="italic" fill="#b0b9c6">skip if already tidy</text>
  <circle cx="316" cy="216" r="4.2" fill="#AD7132"/>
  <text x="330" y="221" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">importDetections()</text>
  <circle cx="316" cy="242" r="4.2" fill="#AD7132"/>
  <text x="330" y="247" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">importDeployments()</text>
  <circle cx="316" cy="268" r="4.2" fill="#AD7132"/>
  <text x="330" y="273" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">importTags()</text>
  <text x="586" y="247" font-size="12.5" fill="#9aa5b4">→ canonical columns</text>
  <line x1="410" y1="300" x2="410" y2="324" stroke="#8b98a8" stroke-width="2" marker-end="url(#pa)"/>

  <!-- ==================== 2 · VALIDATE ==================== -->
  <rect x="34" y="326" width="752" height="76" rx="9" fill="#fbfcfd" stroke="#b0b9c6" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="54" y="356" font-size="15" font-weight="700" fill="#3f4a5a" letter-spacing="0.2">2 · VALIDATE</text>
  <text x="54" y="378" font-size="12.5" font-style="italic" fill="#94a3b8">read-only</text>
  <circle cx="316" cy="351" r="4.2" fill="#64748b"/>
  <text x="330" y="356" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">checkDeployments()</text>
  <text x="330" y="379" font-size="12.5" fill="#9aa5b4">→ a report; never changes your data</text>
  <line x1="410" y1="404" x2="410" y2="428" stroke="#8b98a8" stroke-width="2" marker-end="url(#pa)"/>

  <!-- ==================== 3 · ENRICH ==================== -->
  <rect x="34" y="430" width="752" height="90" rx="9" fill="#f4f6f9" stroke="#b9c4d3" stroke-width="1.2" filter="url(#pcard)"/>
  <text x="54" y="460" font-size="15" font-weight="700" fill="#3f4a5a" letter-spacing="0.2">3 · ENRICH</text>
  <text x="54" y="482" font-size="12.5" font-style="italic" fill="#94a3b8">either order</text>
  <circle cx="316" cy="453" r="4.2" fill="#2F7E8C"/>
  <text x="330" y="458" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">assignAnimalIDs()</text>
  <text x="562" y="458" font-size="12.5" fill="#9aa5b4">→ animals, tagging dates</text>
  <circle cx="316" cy="481" r="4.2" fill="#AD7132"/>
  <text x="330" y="486" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">matchDeployments()</text>
  <text x="562" y="486" font-size="12.5" fill="#9aa5b4">→ stations, coordinates</text>
  <line x1="410" y1="522" x2="410" y2="546" stroke="#8b98a8" stroke-width="2" marker-end="url(#pa)"/>

  <!-- ==================== 4 · CLEAN & BIN ==================== -->
  <rect x="34" y="548" width="752" height="104" rx="9" fill="#f6f8fb" stroke="#b9c4d3" stroke-width="1.2" filter="url(#pcard)"/>
  <text x="54" y="578" font-size="15" font-weight="700" fill="#3f4a5a" letter-spacing="0.2">4 · CLEAN &amp; BIN</text>
  <text x="54" y="600" font-size="12.5" font-style="italic" fill="#94a3b8">removes and</text>
  <text x="54" y="618" font-size="12.5" font-style="italic" fill="#94a3b8">reshapes records</text>
  <circle cx="316" cy="570" r="4.2" fill="#2F7E8C"/>
  <text x="330" y="575" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">filterDetections()</text>
  <circle cx="316" cy="596" r="4.2" fill="#AD7132"/>
  <text x="330" y="601" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">correctPositions()</text>
  <circle cx="316" cy="622" r="4.2" fill="#AD7132"/>
  <text x="330" y="627" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">getTimeBins()</text>
  <text x="586" y="601" font-size="12.5" fill="#9aa5b4">→ take $data</text>
  <line x1="410" y1="654" x2="410" y2="678" stroke="#8b98a8" stroke-width="2" marker-end="url(#pa)"/>

  <!-- ==================== 5 · DECLARE ==================== -->
  <rect x="34" y="680" width="752" height="76" rx="9" fill="#eef2f7" stroke="#9aa5b4" stroke-width="1.3" filter="url(#pcard)"/>
  <text x="54" y="710" font-size="15" font-weight="700" fill="#3f4a5a" letter-spacing="0.2">5 · DECLARE</text>
  <text x="54" y="732" font-size="12.5" font-style="italic" fill="#94a3b8">any time</text>
  <circle cx="316" cy="705" r="4.2" fill="#AD7132"/>
  <text x="330" y="710" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2d3748">as_moby()</text>
  <text x="330" y="733" font-size="12.5" fill="#9aa5b4">→ id.groups · epsg.code · land.shape</text>
  <line x1="410" y1="758" x2="410" y2="782" stroke="#8b98a8" stroke-width="2" marker-end="url(#pa)"/>

  <!-- ==================== mobyData ==================== -->
  <rect x="260" y="784" width="300" height="54" rx="9" fill="#ffffff" stroke="#2F7E8C" stroke-width="2.2"/>
  <text x="410" y="818" font-size="19" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2F7E8C">mobyData</text>
  <line x1="410" y1="840" x2="410" y2="864" stroke="#8b98a8" stroke-width="2" marker-end="url(#pa)"/>

  <!-- ==================== ANALYSIS ==================== -->
  <rect x="34" y="866" width="752" height="64" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="54" y="896" font-size="15" font-weight="700" fill="#475569" letter-spacing="0.2">ANALYSIS</text>
  <text x="310" y="896" font-size="13.5" fill="#576372">residency · space use · movement</text>
  <text x="310" y="917" font-size="13.5" fill="#576372">social networks · spatial networks</text>
</svg>
